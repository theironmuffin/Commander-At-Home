<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="44%" r="55%">
      <stop offset="0%" stop-color="#1E2534"/>
      <stop offset="100%" stop-color="#121620"/>
    </radialGradient>
  </defs>

  <!-- Full-Screen Background -->
  <rect width="1920" height="1080" fill="url(#bgGlow)"/>

  <!-- Subtle Outer Frame -->
  <rect x="44" y="44" width="1832" height="992" rx="28" ry="28"
        fill="none" stroke="#D9B45A" stroke-opacity="0.22" stroke-width="2"/>

  <!-- Centered Emblem (Scaled from 512x512 icon) -->
  <g transform="translate(744, 175) scale(0.84375)">
    <rect x="36" y="36" width="440" height="440" rx="88" ry="88" fill="#1D2330"
          stroke="#D9B45A" stroke-opacity="0.35" stroke-width="4"/>

    <!-- Three-Pointed Commander Crown Behind Roof -->
    <path d="M 186 206 L 154 110 L 218 156 L 256 96 L 294 156 L 358 110 L 326 206"
          fill="none" stroke="#D9B45A" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- House Silhouette Outline -->
    <path d="M 256 156 L 106 276 L 146 276 L 146 408 L 366 408 L 366 276 L 406 276 Z"
          fill="#1D2330" stroke="#D9B45A" stroke-width="18" stroke-linejoin="round"/>

    <!-- Centered Playing Card Outline -->
    <rect x="206" y="246" width="100" height="134" rx="14" ry="14"
          fill="#121620" stroke="#F2EAD3" stroke-width="14"/>

    <!-- Card Corner Accents & Center Mana Diamond -->
    <polygon points="222,262 242,262 222,292" fill="#D9B45A"/>
    <polygon points="290,262 270,262 290,292" fill="#D9B45A"/>
    <polygon points="222,364 242,364 222,334" fill="#D9B45A"/>
    <polygon points="290,364 270,364 290,334" fill="#D9B45A"/>
    <polygon points="256,286 278,313 256,340 234,313" fill="#D9B45A"/>
  </g>

  <!-- Title & Divider -->
  <text x="960" y="720" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="bold"
        letter-spacing="10" fill="#F2EAD3">COMMANDER AT HOME</text>

  <line x1="740" y1="756" x2="1180" y2="756" stroke="#D9B45A" stroke-opacity="0.65" stroke-width="2"/>

  <text x="960" y="806" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="24"
        letter-spacing="6" fill="#D9B45A" fill-opacity="0.88">4-PLAYER 3D TABLETOP</text>
</svg>